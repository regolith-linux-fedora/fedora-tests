name: Boot Test

# Fedora Track Task 01-09 spike: boot a Fedora Workstation VM with KVM on a GitHub-hosted runner,
# log in at GDM with injected keys into sway, and assert on the session over SSH. Stock Fedora only.
# x86_64 always runs; aarch64 runs only if the ubuntu-24.04-arm runner turns out to have working KVM.
on:
  workflow_dispatch:
    inputs:
      release:
        description: "Fedora release (newest blocking Target)"
        default: "45"
      rebuild:
        description: "Rebuild the cached image"
        type: boolean
        default: false
  schedule:
    - cron: "17 4 * * *"
  pull_request:
    paths:
      - "boot/**"
      - ".github/workflows/boot-test.yml"

concurrency:
  group: boot-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  arm-probe:
    runs-on: ubuntu-24.04-arm
    outputs:
      kvm: ${{ steps.probe.outputs.kvm }}
    steps:
      - uses: actions/checkout@v4

      - name: Allow KVM for the runner user
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true
          ls -l /dev/kvm || echo "no /dev/kvm"

      - name: Install QEMU
        run: sudo apt-get update -q && sudo apt-get install -y -q qemu-system-arm

      - name: Probe KVM
        id: probe
        run: |
          if python3 boot/kvm_probe.py --out kvm-probe-aarch64.json; then kvm=true; else kvm=false; fi
          echo "kvm=$kvm" >> "$GITHUB_OUTPUT"
          echo "### aarch64 KVM on ubuntu-24.04-arm: $kvm" >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"; cat kvm-probe-aarch64.json >> "$GITHUB_STEP_SUMMARY"; echo '```' >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: kvm-probe-aarch64
          path: kvm-probe-aarch64.json

  plan:
    runs-on: ubuntu-24.04
    needs: arm-probe
    if: ${{ always() }}
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      # Releases: the dispatch input, or 45 on pull requests. The nightly run boots the two newest
      # blocking Targets in voulage docs/fedora/targets.json (01-07), so older releases keep coverage.
      - id: plan
        env:
          EVENT: ${{ github.event_name }}
          RELEASE: ${{ inputs.release || '45' }}
          ARM_KVM: ${{ needs.arm-probe.outputs.kvm }}
          TARGETS_URL: https://raw.githubusercontent.com/regolith-linux-fedora/voulage/fedora/main/docs/fedora/targets.json
        run: |
          if [ "$EVENT" = schedule ]; then
            releases=$(curl -fsSL "$TARGETS_URL" | jq -r '[.targets[].release | tonumber] | sort | .[-2:] | map(tostring) | join(" ")')
          else
            releases=$RELEASE
          fi
          matrix=$(jq -n -c --arg releases "$releases" --argjson arm "${ARM_KVM:-false}" '
            [($releases | split(" ")[] | select(. != "")) as $r
             | ({arch: "x86_64", runner: "ubuntu-24.04", qemu: "qemu-system-x86"},
                if $arm then {arch: "aarch64", runner: "ubuntu-24.04-arm", qemu: "qemu-system-arm qemu-efi-aarch64"} else empty end)
             | . + {release: $r}]')
          echo "$matrix" | jq .
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  boot:
    needs: plan
    if: ${{ always() && needs.plan.result == 'success' }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    env:
      RELEASE: ${{ matrix.release }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          df -h /

      - name: Allow KVM for the runner user
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install QEMU and tools
        run: sudo apt-get update -q && sudo apt-get install -y -q ${{ matrix.qemu }} qemu-utils cloud-image-utils gpgv gnupg

      - name: Probe KVM
        run: mkdir -p artifacts && python3 boot/kvm_probe.py --out artifacts/kvm-probe-${{ matrix.arch }}.json

      # Computed once: building the image imports boot/vmtest and writes __pycache__ there, so a
      # hashFiles() in the save step would give a key that the next run's restore never matches.
      - name: Image cache key
        id: key
        run: |
          echo "key=boot-image-$RELEASE-${{ matrix.arch }}-${{ hashFiles('boot/image/**', 'boot/build_image.py', 'boot/vmtest/*.py') }}-$(date -u +%G-W%V)" >> "$GITHUB_OUTPUT"

      - name: Restore image
        id: cache
        if: ${{ !inputs.rebuild }}
        uses: actions/cache/restore@v4
        with:
          path: cache
          key: ${{ steps.key.outputs.key }}

      - name: Build image
        if: ${{ steps.cache.outputs.cache-hit != 'true' }}
        run: |
          mkdir -p cache
          [ -f cache/id_ed25519 ] || ssh-keygen -q -t ed25519 -N '' -C boot-test -f cache/id_ed25519
          python3 boot/build_image.py --release "$RELEASE" --arch ${{ matrix.arch }} \
            --ssh-pubkey cache/id_ed25519.pub --out cache/boot-$RELEASE-${{ matrix.arch }}.qcow2 --workdir work/image
          rm -rf work/image
          ls -lh cache

      - name: Save image
        if: ${{ steps.cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: cache
          key: ${{ steps.key.outputs.key }}

      - name: Boot Test
        timeout-minutes: 30
        run: |
          python3 boot/boot_test.py --image cache/boot-$RELEASE-${{ matrix.arch }}.qcow2 --arch ${{ matrix.arch }} \
            --ssh-key cache/id_ed25519 --artifacts artifacts/boot-${{ matrix.arch }}

      - name: Summary
        if: ${{ always() }}
        run: |
          r=artifacts/boot-${{ matrix.arch }}/results.json
          [ -f "$r" ] || exit 0
          {
            echo "### Boot Test ${{ matrix.arch }} (Fedora $RELEASE): $(jq -r 'if .ok then "PASSED" else "FAILED" end' "$r") in $(jq .seconds "$r")s"
            echo "| step | result | seconds | error |"; echo "|---|---|---|---|"
            jq -r '.steps[] | "| \(.name) | \(if .ok then "ok" else "FAIL" end) | \(.seconds) | \(.error) |"' "$r"
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: boot-test-${{ matrix.arch }}-fedora-${{ matrix.release }}
          path: |
            artifacts/
            work/image/vm/serial.log
            work/image/*.png
            cache/*.json
          if-no-files-found: ignore
