#cloud-config
# Template filled in by build_image.py: @PASSWORD@, @SSH_PUBKEY@, @PROVISION@ (boot/image/provision.sh).
users:
  - name: tester
    gecos: Boot Test
    groups: [wheel]
    sudo: "ALL=(ALL) NOPASSWD:ALL"
    shell: /bin/bash
    lock_passwd: false
    plain_text_passwd: "@PASSWORD@"
    ssh_authorized_keys:
      - "@SSH_PUBKEY@"
ssh_pwauth: false

growpart:
  mode: auto
  devices: ["/"]
resize_rootfs: true

write_files:
  - path: /usr/local/sbin/boot-test-provision
    permissions: "0755"
    encoding: b64
    content: "@PROVISION@"

runcmd:
  - [/usr/local/sbin/boot-test-provision]

power_state:
  mode: poweroff
  timeout: 120
  condition: true
