# Minimal stock sway config for the Session Test's stock profile (no Regolith packages).
set $mod Mod4

output HEADLESS-1 resolution 1280x800 bg #285577 solid_color

default_border normal 2
font monospace 11

# The one real keybinding the stock tests drive with wtype.
bindsym $mod+Return exec foot

# Deliberately unbound: tests/stock/test_stock.py::test_unbound_key_opens_no_window
# presses $mod+F12 and asserts that nothing opens.
